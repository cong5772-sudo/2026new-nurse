<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b6b6a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6b6a'/%3E%3Cpath d='M9 22V10h3l5 7.5V10h3v12h-3l-5-7.5V22z' fill='%23fff'/%3E%3C/svg%3E">
<title>신규간호사 발령 유지관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* 기본 리셋 */
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@font-face{font-family:"S-Core Dream";font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:500;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:600;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:700 900;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-8Heavy.woff") format("woff")}
/* Layout: 좌측 고정 내비 + 우측 작업면(필터 → KPI → 패널 그리드). 휴대폰에서는 내비가 하단 탭바로 바뀜 */
:root{
  --bg:#eef3f3; --surface:#fbfdfd; --sunk:#e4ecec; --ink:#0f1c1e; --ink2:#46585b; --muted:#6f8285;
  --line:#d6e1e2; --line2:#c2d0d1; --accent:#0b6b6a; --accent-ink:#ffffff; --accent-soft:#d3e9e7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --seq:#2a78d6; --warm:#eb6834;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42d2d;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1112; --surface:#121b1c; --sunk:#0e1617; --ink:#e9f1f1; --ink2:#b3c3c4; --muted:#83979a;
    --line:#223032; --line2:#2e3f41; --accent:#4fb3ad; --accent-ink:#06201f; --accent-soft:#163837;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --seq:#3987e5; --warm:#d95926;
    --good-ink:#2fc22f; --crit-ink:#ef7a7a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1112; --surface:#121b1c; --sunk:#0e1617; --ink:#e9f1f1; --ink2:#b3c3c4; --muted:#83979a;
  --line:#223032; --line2:#2e3f41; --accent:#4fb3ad; --accent-ink:#06201f; --accent-soft:#163837;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --seq:#3987e5; --warm:#d95926;
  --good-ink:#2fc22f; --crit-ink:#ef7a7a;
}
*{box-sizing:border-box}
html{height:100%}body{min-height:100%}
/* 넓은 화면에서는 브라우저 150% 확대와 같은 크기로 보이게 (휴대폰·좁은 창·인쇄는 그대로) */
:root{--z:1}
@media (min-width:1300px){:root{--z:1.25}html{zoom:1.25}}
@media (min-width:1560px){:root{--z:1.5}html{zoom:1.5}}
@media print{:root{--z:1}html{zoom:1}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:grid;gap:2px;padding-inline:8px}
.brand small{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.brand b{font-size:16px;font-weight:700;line-height:1.3}
.navlist{display:grid;gap:4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--ink2);font-weight:500}
.navbtn .k{font-family:var(--f-num);font-size:11px;color:var(--muted);width:18px}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navbtn[aria-current="page"] .k{color:inherit;opacity:.75}
.navfoot{margin-top:auto;display:grid;gap:6px;padding:12px;border-radius:8px;background:var(--sunk);font-size:12px;color:var(--ink2)}
.navfoot b{color:var(--ink);font-weight:600}

.main{padding:28px clamp(16px,3vw,40px) 64px;display:grid;gap:20px;align-content:start;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.stamp{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--ink2);background:var(--surface);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill .dot[data-state="live"]{background:var(--good)}.pill .dot[data-state="stale"]{background:var(--warn)}.pill .dot[data-state="error"]{background:var(--crit)}
.msg h2{margin:0;font-size:16px}.msg p{margin:0;color:var(--ink2)}

.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;flex:none}
.dshort{display:none;font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:6px;align-content:start}
.kpi .lab{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .val{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.03em}
.kpi .val small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--ink2);margin-left:2px;letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.panel{grid-column:span 6;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.panel.w12{grid-column:span 12}.panel.w8{grid-column:span 8}.panel.w4{grid-column:span 4}.panel.w7{grid-column:span 7}.panel.w5{grid-column:span 5}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.6}
.note b{color:var(--ink)}

/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;color:#fff;line-height:1}
.st.crit i{background:var(--crit)}.st.warn i{background:var(--warn);color:#2b1d00}.st.good i{background:var(--good)}.st.none i{background:var(--line2)}
.st.crit{color:var(--crit-ink)}.st.good{color:var(--good-ink)}.st.warn{color:var(--ink)}

/* vertical bars */
.vb{display:grid;gap:6px}
.vb .plot{position:relative;height:var(--h,190px);display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:end;border-bottom:1px solid var(--line2);padding-top:20px}
.vb .col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;cursor:default}
.vb .bar{width:min(64px,72%);border-radius:4px 4px 0 0;background:var(--c,var(--s1));min-height:2px;transition:filter .15s}
.vb .col:hover .bar{filter:brightness(1.12)}
.vb .v{font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);padding:0 3px;border-radius:3px;position:relative;z-index:2}
.vb .xl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;text-align:center;font-size:12px;color:var(--ink2)}
.vb .xl span small{display:block;color:var(--muted);font-size:11px}
.ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--rc,var(--crit));pointer-events:none;z-index:1}
.vb .plot:has(.ref){padding-right:52px}
.vb:has(.ref) .xl{padding-right:52px}
.ref span{position:absolute;right:0;bottom:2px;font-size:11px;color:var(--ink2);background:var(--surface);padding:0 4px;border-radius:3px}
.ref.avg{--rc:var(--muted)}

/* horizontal bars */
.hb{display:grid;gap:6px}
.hb .row{display:grid;grid-template-columns:minmax(64px,7.5rem) minmax(0,1fr) 5.5rem;gap:10px;align-items:center;font-size:13px;padding:2px 0;cursor:default}
.hb .row:hover .track{background:var(--sunk)}
.hb .lab{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{position:relative;height:18px;border-radius:4px}
.hb .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--c,var(--s1))}
.hb .fill.thin{background:repeating-linear-gradient(135deg,var(--c,var(--s1)) 0 3px,transparent 3px 6px);outline:1px solid var(--c,var(--s1));outline-offset:-1px}
.hb .rv{font-family:var(--f-num);font-size:12px;text-align:right;color:var(--ink)}
.hb .rv small{color:var(--muted);font-size:11px;margin-left:4px}
.hb .vref{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--rc,var(--crit));z-index:1}
.hb .vref.avg{--rc:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:0;border-top:1.5px dashed var(--rc,var(--crit))}
.legend i.sw{width:10px;height:10px;border:0;border-radius:2px;background:var(--c)}
.legend i.ln{width:16px;height:0;border-top:2px solid var(--c)}
.legend i.hatch{width:12px;height:10px;border:0;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px);outline:1px solid var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
thead th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:12px;color:var(--ink2)}
thead th.sort{cursor:pointer;user-select:none}
thead th.sort:hover{color:var(--ink)}
thead th .ar{color:var(--muted);font-size:10px;margin-left:3px}
tbody tr:hover td{background:color-mix(in oklab,var(--accent-soft) 45%,transparent)}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
td.num,th.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.cell{position:relative}
.heat{background:color-mix(in oklab,var(--c,var(--seq)) var(--p,0%),var(--surface))}
.heat.hi{color:#fff}
.zero{color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:var(--sunk);color:var(--ink2)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;width:180px;max-width:100%}

/* cohort timeline */
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tli{position:relative;padding:14px 14px 12px;border:1px solid var(--line);border-radius:8px;display:grid;gap:4px;background:var(--surface)}
.tli.dim{opacity:.45}
.tli .no{font-size:12px;font-weight:600;color:var(--accent)}
.tli .dt{font-family:var(--f-num);font-size:17px;font-weight:600}
.tli .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.tli .bar2{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;gap:2px}
.tli .bar2 b{background:var(--s1)}.tli .bar2 em{background:var(--crit)}
.tli.next{border-style:dashed;background:transparent}
.tli.next .dt{color:var(--muted)}

/* tabs (page 4) */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab small{display:block;font-size:11px;color:var(--muted);font-weight:400}

.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.find{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.find .st{grid-row:span 2;align-self:start;margin-top:2px}
.find b{font-size:13px}
.find p{margin:0;font-size:12px;color:var(--ink2)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;border-left:4px solid var(--tc,var(--line2));cursor:default}
.tile b{font-size:14px}
.tile .num{font-size:18px;font-weight:600}
.tile small{color:var(--muted);font-size:11px}
.tile.crit{--tc:var(--crit)}.tile.warn{--tc:var(--warn)}.tile.good{--tc:var(--good)}

.stack{grid-column:span 5;display:grid;gap:12px;align-content:start;min-width:0}.stack>.panel{grid-column:auto}
.gt th,.gt td{text-align:center;padding:11px 12px}.gt th:first-child,.gt td:first-child{text-align:left;padding-left:14px}
.gt th.coh{color:var(--accent)}
.gt tr.gh td{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.gt tr.sub td{background:var(--sunk);font-weight:700}
.gt td.cum{color:var(--ink2)}.gt tr.sub td.cum,.gt tr.sub td:last-child{color:var(--ink)}
.gt tfoot td{border-top:2px solid var(--ink2)}
.pbar{display:grid;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.ptabs{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunk);max-width:100%;overflow-x:auto}
.ptab{border:0;background:none;padding:7px 18px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pchips{display:flex;gap:4px;align-items:center;overflow-x:auto;padding-bottom:2px}
.pchips .chip{flex:none}
.pnav{flex:none;width:30px;height:30px;border:1px solid var(--line2);border-radius:50%;background:var(--surface);cursor:pointer;font-size:16px;line-height:1;color:var(--ink2)}
.pnav:disabled{opacity:.35;cursor:default}
.prange{font-size:13px;color:var(--ink2)}.prange b{font-family:var(--f-num);color:var(--ink);margin-left:4px}
.pdef{font-size:12px;color:var(--muted)}
.vb .col[data-pk]{cursor:pointer}
.cmp{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line2);font-size:12px;color:var(--ink2)}
.cmp b{color:var(--ink);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--muted)}
.psep{flex:none;width:1px;height:20px;background:var(--line2);margin-inline:4px}
.phint{flex:none;font-size:11px;color:var(--muted);margin-left:4px}
.hero{border-color:var(--line2)}
.dt thead th{position:static}
.dt .band th{background:var(--surface);font-size:11px;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line);padding:6px 10px}
.dt th.bd{text-align:center}
.dt th.prevband,.dt .band th.prevband{background:color-mix(in oklab,var(--accent-soft) 60%,var(--sunk));color:var(--ink)}
.dt td.prev{background:color-mix(in oklab,var(--accent-soft) 32%,transparent);color:var(--ink2)}
.dt td.prev.hot{color:var(--crit-ink);font-weight:600}
.dt .rc{white-space:nowrap}
.rc .mb{display:inline-block;vertical-align:middle;width:52px;height:6px;margin-right:8px;border-radius:3px;background:var(--sunk);overflow:hidden}
.rc .mb i{display:block;height:100%;border-radius:3px}
.dl{font-family:var(--f-num);font-size:12px;font-weight:600}.dl.up{color:var(--crit-ink)}.dl.dn{color:var(--good-ink)}
b.rd{color:var(--crit-ink)}
.yrs{display:grid;gap:1px}
.yrow{display:grid;grid-template-columns:4.2rem minmax(0,1fr) 3.4rem 3.4rem 3.4rem;gap:10px;align-items:center;font-size:13px;padding:3px 0;cursor:default}
.yrow .num{text-align:right}
.yrow:hover .ytrack{background:var(--sunk)}
.yhead{font-size:11px;color:var(--muted);padding:0;cursor:auto}
.yg{font-size:12px;font-weight:600;color:var(--accent);padding:12px 0 3px;border-bottom:1px solid var(--line);margin-bottom:2px}
.ytrack{position:relative;height:20px;border-radius:4px}
.ytrack .vref{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--crit);z-index:1}
.yfill{position:absolute;left:0;top:4px;bottom:4px;border-radius:0 4px 4px 0;background:var(--c)}
.mk{position:absolute;top:50%;z-index:2}
.mk.m25{width:9px;height:9px;background:var(--ink);border:1.5px solid var(--surface);transform:translate(-50%,-50%) rotate(45deg)}
.mk.m24{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--ink2);transform:translate(-50%,-50%)}
.legend i.mk-l{display:inline-block}
.legend i.mk-l.m25{width:8px;height:8px;border:0;background:var(--ink);transform:rotate(45deg)}
.legend i.mk-l.m24{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);background:var(--surface)}
.y26{font-weight:600}.y25,.y24{color:var(--ink2)}

/* ===== 좌측 메뉴·조회조건 레이아웃 (남색·파랑 톤) ===== */
:root{
  --bg:#fafafa; --surface:#ffffff; --sunk:#f4f4f5; --ink:#111827; --ink2:#4b5563; --muted:#6b7280;
  --line:#e7e7ea; --line2:#d4d4d8; --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#eef2fb;
  --s1:#2563eb; --s2:#f59e0b; --s3:#10b981; --seq:#2563eb; --warm:#f59e0b;
  --navy:#1f3a68; --navy2:#2a4b85;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121a2b; --sunk:#0f1626; --ink:#e8edf6; --ink2:#b6c0d1; --muted:#8a96aa;
    --line:#1f2a3f; --line2:#2b3954; --accent:#60a5fa; --accent-ink:#0b1220; --accent-soft:#16264a;
    --s1:#60a5fa; --s2:#fbbf24; --s3:#34d399; --seq:#60a5fa; --warm:#fbbf24; --navy:#14254a; --navy2:#1d3566;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121a2b; --sunk:#0f1626; --ink:#e8edf6; --ink2:#b6c0d1; --muted:#8a96aa;
  --line:#1f2a3f; --line2:#2b3954; --accent:#60a5fa; --accent-ink:#0b1220; --accent-soft:#16264a;
  --s1:#60a5fa; --s2:#fbbf24; --s3:#34d399; --seq:#60a5fa; --warm:#fbbf24; --navy:#14254a; --navy2:#1d3566;
}
body{background:var(--bg)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(16px,2vw,28px);background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(17,24,39,.05)}
.tb-l{display:flex;align-items:center;gap:12px;min-width:0}
.logo-sq{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:20px;line-height:1}
.tb-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.org{display:grid;text-align:right;line-height:1.25;margin-right:6px}
.org b{font-size:13px;color:var(--navy)}
.org small{font-size:11px;color:var(--muted)}
.refresh{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;font-size:16px}
.refresh:hover{border-color:var(--accent);color:var(--accent)}

.app{display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;align-items:start;padding:24px clamp(16px,2vw,28px) 48px;max-width:none;margin:0}
.side{position:sticky;top:calc(var(--tbh,64px) + 12px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh / var(--z) - var(--tbh,64px) - 24px);overflow:hidden}
.side .navcard{flex:none}
.sscroll{flex:1 1 auto;min-height:0;overflow:auto;display:grid;gap:14px;align-content:start;padding-bottom:4px;scrollbar-width:thin}
/* 페이지 제목: 스크롤해도 상단에 고정 */
@media (min-width:821px){
  .head{position:sticky;top:var(--tbh,64px);z-index:20;background:var(--bg);margin:-24px 0 -8px;padding:20px 0 12px;box-shadow:0 10px 12px -12px rgba(15,28,30,.25)}
}
.navcard{background:linear-gradient(160deg,var(--navy2),var(--navy));border-radius:16px;padding:10px;box-shadow:0 6px 18px rgba(31,58,104,.22)}
.navcard .navlist{display:grid;gap:4px}
.navcard .navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:none;color:rgba(255,255,255,.82);font-weight:600;font-size:14.5px;text-align:left;cursor:pointer}
.navcard .navbtn .ic{width:18px;text-align:center;opacity:.85}
.navcard .navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navcard .navbtn[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff}

.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
.fcard summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fcard summary::-webkit-details-marker{display:none}
.fcard summary span{font-weight:500;font-size:11px;color:var(--accent);text-align:right}
.fcard[open] summary{margin-bottom:10px}
#f-side{display:grid;gap:14px}
.fs{display:grid;gap:7px}
.fl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.cg{display:flex;flex-wrap:wrap;gap:6px}
.cg.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fcard .chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500}
.fcard .cg.mg .chip{padding:0}
.fcard .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.fcard .chip:disabled{opacity:.35;cursor:default}
.fcard select{height:38px;border:1px solid var(--line2);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font-size:13.5px}
.fcard select:disabled{color:var(--muted);background:var(--sunk)}
.fhint{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.freset{height:34px;border:1px dashed var(--line2);border-radius:10px;background:none;color:var(--ink2);font-size:12.5px;cursor:pointer}
.freset:hover{border-color:var(--accent);color:var(--accent)}
.side .navfoot{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}

.main{padding:0;gap:20px;min-width:0}
.head{display:flex;align-items:flex-end}
.head h1{font-size:22px}
.head p{font-size:13px}

/* KPI: 첫 카드는 남색 강조 카드 */
.kpis{gap:14px}
.kpi{border-radius:16px;padding:20px 22px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(17,24,39,.04)}
.kpi .val{font-size:34px}

.kpi:first-child::after{width:110px;height:110px;right:70px;bottom:-60px}

.kpi:first-child .cmp{border-top-color:rgba(255,255,255,.25);color:rgba(255,255,255,.82)}
.kpi:first-child .cmp b,.kpi:first-child .sub b{color:#fff}
.kpi:first-child .st{color:#fff}

/* 섹션 카드 + 제목 앞 파란 막대 */
.panel{border-radius:16px;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.ph h2{display:flex;align-items:center;gap:8px}
.ph h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}

.tli .no{color:var(--accent)}

@media (max-width:1100px), (min-width:1300px) and (max-width:1375px), (min-width:1560px) and (max-width:1650px){.app{grid-template-columns:230px minmax(0,1fr)}}
@media (max-width:820px){
  .topbar{flex-wrap:wrap}
  .org,.tb-r .pill:nth-of-type(2){display:none}
  .app{grid-template-columns:minmax(0,1fr);padding-top:14px;gap:14px}
  .side{position:static;max-height:none;overflow:visible}
  .sscroll{overflow:visible;display:contents}
  /* 모바일: 파란 메뉴 박스를 상단 바 아래에 고정 */
  .side{display:contents}
  .side .navcard{position:sticky;top:var(--tbh,56px);z-index:22;box-shadow:0 6px 14px rgba(31,58,104,.28)}
  .navcard{padding:6px}
  .navcard .navlist{grid-template-columns:repeat(4,1fr);width:auto}
  .navcard .navbtn{flex-direction:column;gap:2px;padding:8px 4px;font-size:12.5px;text-align:center;justify-content:center}

/* 글꼴: 에스코어드림 */

<script>
const CFG = window.DASH_CONFIG || {};
const TARGET = CFG.TARGET ?? 0.20;
const PREV_ALL = CFG.PREV_ALL || {};
// 연도별 발령·사직 합계 (발령일 기준)
const yearTot = y => { let p = 0, r = 0; for (const [k, [pp, rr]] of Object.entries(A.dept)) if (k.startsWith(y + '-')){ p += pp; r += rr; } return { p, r }; };
// 연도별 비교값: 시트에 그 연도 탭이 있으면 실제 값, 없으면 config.js의 PREV_ALL
const pa = y => { if (A && YEARS.includes(y)){ const t = yearTot(y); return { placed: t.p, rate: t.p ? t.r / t.p : NaN }; } return PREV_ALL[y] || {}; };
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
// 아래 값은 API 응답을 받은 뒤 setData()에서 채운다
let A = null, PREV = {}, PREVSHEET = {}, GROUPS = [], GNAMES = [], DPOS = {}, COH = [], YEARS = [], YLATEST, DAY0, Y0, Y1, Y2, YINIT = false;
const grpOf = d => DPOS[d]?.[2] ?? '기타';
function setData(data){
  A = data;
  GROUPS = data.groups; GNAMES = GROUPS.map(g => g[0]);
  DPOS = {}; GROUPS.forEach(([g, ds], gi) => ds.forEach((d, i) => DPOS[d] = [gi, i, g]));
  COH = [...new Set(Object.keys(A.dept).map(k => k.split('|')[0]))].sort();
  DAY0 = new Date(COH[0] + 'T00:00:00');
  YEARS = [...new Set(COH.map(c => +c.slice(0, 4)))].sort(); YLATEST = YEARS.at(-1);
  PREVSHEET = data.prev?.dept || {};
  // 연도 탭이 2개 이상이면 처음 열 때 가장 최근 연도를 보여준다
  if (!YINIT){ YINIT = true; if (YEARS.length > 1 && SB.y === 'all'){ SB.y = YLATEST; syncPS(); } }
  setYear();
  if (!GNAMES.includes(S.g)) S.g = 'all';
  if (!COH.includes(S.c)) S.c = 'all';
}
// 기준 연도(Y0)와 비교 연도(Y1·Y2): 왼쪽 '기준일시'에서 연도를 고르면 그 연도, 아니면 가장 최근 연도
function setYear(){
  Y0 = SB.y !== 'all' ? SB.y : YLATEST; Y1 = Y0 - 1; Y2 = Y0 - 2;
  // 부서별 전년도 사직율: 시트에 그 연도 탭이 있으면 실제 값, 없으면 '부서별 발령/사직' 탭의 값
  const rateOf = (y, d) => {
    if (!YEARS.includes(y)) return PREVSHEET[d]?.[y] ?? NaN;
    let p = 0, r = 0;
    for (const [k, [pp, rr]] of Object.entries(A.dept)){ const [c, dd] = k.split('|'); if (dd === d && c.startsWith(y + '-')){ p += pp; r += rr; } }
    return p ? r / p : NaN;
  };
  PREV = {};
  const depts = new Set(Object.keys(A.dept).map(k => k.split('|')[1]).concat(Object.keys(PREVSHEET)));
  for (const d of depts){ const v = [rateOf(Y2, d), rateOf(Y1, d)]; if (v.some(x => !isNaN(x))) PREV[d] = v; } // [2년 전, 1년 전]
}
const SER = i => ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'][i % 6];
const cLab = c => (YEARS.length > 1 && SB.y === 'all' ? c.slice(2, 4) + '년 ' : '') + (COH.filter(x => x.slice(0, 4) === c.slice(0, 4)).indexOf(c) + 1) + '차';
const cShort = c => c.slice(5).replace('-', '.');
const S = { c:'all', g:'all', d:'all', page:'p1', tab:'hr', sort:{k:'tot',dir:-1}, q:'' };
// 사이드바 기간 선택: 연도 / 분기(여러 개) / 월(여러 개) → 아래 syncPS()가 PS(기간 상태)로 옮긴다
const SB = { y:'all', q:[], m:[] };

const pct = (x, d=1) => isFinite(x) ? (x*100).toFixed(d) + '%' : '–';
// 발령현황·부서별 사직은 발령일이 선택 기간에 들어가는 회차만, 사직분석은 모든 회차(기간은 사직일에 적용)
const inC = c => S.page === 'p2' || PS.mode === 'now' || inPer(new Date(c + 'T00:00:00'), curPeriod());
const inD = d => S.d === 'all' || S.d === d;
const inG = g => S.g === 'all' || S.g === g;
const days = (a, b) => Math.round((b - a) / 864e5);
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d; };
const fmtD = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function deptOrder(a, b){
  const pa = DPOS[a] || [99, 0], pb = DPOS[b] || [99, 0];
  return pa[0] - pb[0] || pa[1] - pb[1] || a.localeCompare(b);
}
function depts(){
  const m = {};
  for (const [k, [p, r]] of Object.entries(A.dept)){
    const [c, d] = k.split('|'); const g = grpOf(d);
    if (!inG(g) || !inD(d)) continue;
    m[d] ??= { d, g, by:{}, p:0, r:0 };
    m[d].by[c] = [p, r];
    if (inC(c)){ m[d].p += p; m[d].r += r; }
  }
  return Object.values(m).sort((a, b) => deptOrder(a.d, b.d));
}
function facet(obj){
  const m = {};
  for (const [k, [p, rd]] of Object.entries(obj)){
    const [c, g, key] = k.split('|');
    if (!inC(c) || !inG(g)) continue;
    m[key] ??= [0, 0]; m[key][0] += p; m[key][1] += rd.length;
  }
  return m;
}
// res row: [cohort, group, 사직발생기간, 사유, 사직 경과월(1=1개월 이내), 근속일, 인원]
const resF = () => A.res.filter(r => inC(r[0]) && inG(r[1]));
function totals(){
  let p = 0, r = 0; for (const d of depts()){ p += d.p; r += d.r; } return { p, r };
}
function byCohort(){
  return COH.map(c => {
    let p = 0, r = 0;
    for (const [k, [pp, rr]] of Object.entries(A.dept)){ const [cc, d] = k.split('|'); if (cc === c && inG(grpOf(d)) && inD(d)){ p += pp; r += rr; } }
    return { c, p, r };
  });
}
function tier(rate, n, prev){
  if (!n) return 'none';
  if (rate >= 0.4 || (prev && prev[1] > 0.3 && rate > 0.3)) return 'crit';
  if (rate >= TARGET) return 'warn';
  return 'good';
}
const TIER = { crit:['!','위험'], warn:['▲','주의'], good:['✓','안정'], none:['–','해당 없음'] };
const stBadge = t => `<span class="st ${t}"><i aria-hidden="true">${TIER[t][0]}</i>${TIER[t][1]}</span>`;

/* ---------- chart builders ---------- */
function vbars(items, o = {}){
  const max = o.max ?? Math.max(...items.map(i => i.v), 0.0001);
  const refs = (o.refs || []).map(r => `<div class="ref ${r.cls||''}" style="bottom:${r.v/max*100}%"><span>${esc(r.label)}</span></div>`).join('');
  return `<div class="vb" style="--n:${items.length};--h:${o.h||190}px">
    <div class="plot">${refs}${items.map(i => `<div class="col" ${i.attr || ''} data-tip="${esc(i.tip||'')}">
      <span class="v">${i.vl ?? i.v}</span><div class="bar" style="height:${Math.max(i.v/max*100, .6)}%;--c:${i.c||'var(--s1)'}"></div></div>`).join('')}</div>
    <div class="xl">${items.map(i => `<span>${esc(i.label)}${i.sub ? `<small>${esc(i.sub)}</small>` : ''}</span>`).join('')}</div></div>`;
}
function hbars(items, o = {}){
  const max = o.max ?? Math.max(...items.map(i => i.v), 0.0001);
  const refs = (o.refs || []).map(r => `<div class="vref ${r.cls||''}" style="left:${r.v/max*100}%"></div>`).join('');
  return `<div class="hb">${items.map(i => `<div class="row" data-tip="${esc(i.tip||'')}">
    <span class="lab">${i.lh ?? esc(i.label)}</span>
    <div class="track">${refs}<div class="fill ${i.thin?'thin':''}" style="width:${Math.max(i.v/max*100, .5)}%;--c:${i.c||'var(--s1)'}"></div></div>
    <span class="rv">${i.vl ?? i.v}${i.n != null ? `<small>n=${i.n}</small>` : ''}</span></div>`).join('')}</div>`;
}
const refLegend = (avg) => `<div class="legend"><span><i></i>목표 20%</span>${avg != null ? `<span><i style="--rc:var(--muted)"></i>전체 평균 ${pct(avg)}</span>` : ''}</div>`;

function survival(el){
  const W = Math.max(el.clientWidth, 280), H = 250, L = 44, R = 70, T = 14, B = 32;
  const res = resF();
  const series = COH.filter(inC).map(c => {
    const n = byCohort().find(x => x.c === c).p;
    const el_m = Math.floor(days(new Date(c + 'T00:00:00'), TODAY) / 30.44);
    const pts = [];
    for (let m = 0; m <= el_m; m++){
      const gone = res.filter(r => r[0] === c && r[4] <= m).reduce((s, r) => s + r[6], 0);
      pts.push({ m, v: n ? 1 - gone / n : 1, gone, n });
    }
    return { c, pts, col: SER(COH.indexOf(c)) };
  });
  const maxM = Math.max(9, ...series.map(s => s.pts.length - 1));
  const minV = Math.min(0.7, Math.floor(Math.min(...series.flatMap(s => s.pts.map(p => p.v))) * 10) / 10);
  const x = m => L + (W - L - R) * m / maxM, y = v => T + (H - T - B) * (1 - (v - minV) / (1 - minV));
  let g = '';
  for (let v = minV; v <= 1.0001; v += 0.1){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v*100)}%</text>`;
  }
  for (let m = 0; m <= maxM; m++) g += `<text x="${x(m)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${m}</text>`;
  g += `<text x="${W-R+8}" y="${H-10}" font-size="11" fill="var(--muted)">개월</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y(minV)}" y2="${y(minV)}" stroke="var(--line2)"/>`;
  g += `<rect x="${x(1)}" y="${T}" width="${x(3)-x(1)}" height="${H-T-B}" fill="var(--crit)" opacity=".06"/>
        <text x="${(x(1)+x(3))/2}" y="${T+12}" text-anchor="middle" font-size="10.5" fill="var(--crit-ink)">조기사직 집중 구간</text>`;
  for (const s of series){
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.m)},${y(p.v)}`).join('');
    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round"/>`;
    for (const p of s.pts) g += `<circle cx="${x(p.m)}" cy="${y(p.v)}" r="${p === s.pts.at(-1) ? 4.5 : 3}" fill="${s.col}" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${x(p.m)}" cy="${y(p.v)}" r="11" fill="transparent" data-tip="${cLab(s.c)} · 입사 ${p.m}개월\n잔존율 ${pct(p.v)} (누적 사직 ${p.gone}/${p.n}명)"/>`;
    const e = s.pts.at(-1);
    g += `<text x="${x(e.m)+8}" y="${y(e.v)+4}" font-size="11.5" font-weight="600" fill="var(--ink)">${cLab(s.c)} ${pct(e.v,0)}</text>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="회차별 경과월 잔존율">${g}</svg>`;
}

/* ---------- pages ---------- */
const PAGES = {
  p1: { t:'발령현황', s:'회차별 발령 규모와 부서 배치를 한눈에 확인합니다.' },
  p2: { t:'사직분석', s:'사직율, 사직 발생 시기, 선발 지표별 사직 경향을 봅니다.' },
  p3: { t:'부서별 사직분석', s:'부서별 올해 사직 현황을 전년도 사직율과 나란히 비교합니다.' },
  p4: { t:'교육과정 만족도', s:'신규간호사 교육과정 설문 결과를 회차별로 분석합니다.' },
};

const cmp = items => `<span class="cmp">${items.map(([a, b]) => `<span>${a} <b class="num">${b}</b></span>`).join('')}${S.g !== 'all' || S.c !== 'all' ? '<span class="zero">전년도는 전체 기준</span>' : ''}</span>`;
function kpi(lab, val, unit, sub){ return `<div class="kpi"><span class="lab">${lab}</span><span class="val">${val}${unit ? `<small>${unit}</small>` : ''}</span><span class="sub">${sub||''}</span></div>`; }

// 전년도 비교: 연도별 발령인원을 재직(파랑)·사직(주황)으로 나눈 가로 막대 (전체 기준)
function yoy(){
  const cy = Y0;
  const rows = Object.keys(PREV_ALL).map(Number).filter(y => !YEARS.includes(y) && y < YEARS[0]).map(y => { const x = PREV_ALL[y]; const rr = Math.round(x.placed * x.rate); return { y, p: x.placed, r: rr, rate: x.rate, est: true }; });
  YEARS.forEach(y => { const s = yearTot(y); rows.push({ y, p: s.p, r: s.r, rate: s.p ? s.r / s.p : 0, cur: y === cy, open: y >= TODAY.getFullYear() }); });
  rows.sort((a, b) => a.y - b.y);
  const max = Math.max(...rows.map(x => x.p));
  const ci = rows.findIndex(x => x.cur), prev = ci > 0 ? rows[ci - 1] : null;
  return `<section class="panel w12 yoy"><div class="ph"><div><h2>전년도 비교</h2><p>신규간호사 전체 기준 · 연도별 발령 탭의 실제 값${rows.some(x => x.est) ? ' · 탭이 없는 연도는 사직율로 환산한 값' : ''}</p></div>
    <div class="legend"><span><i class="sw" style="--c:var(--s1)"></i>재직</span><span><i class="sw" style="--c:var(--s2)"></i>사직</span></div></div>
    <div class="ybars">${rows.map(x => `<div class="yb" data-tip="${x.y}년\n발령 ${x.p}명 · 사직 ${x.r}명${x.est ? ' (환산)' : ''} · 사직율 ${pct(x.rate)}">
      <b>${x.y}</b><div class="ytr"><i style="width:${(x.p - x.r) / max * 100}%;background:var(--s1)"></i><i style="width:${x.r / max * 100}%;background:var(--s2)"></i></div>
      <span>총 ${x.p}명${x.open ? ' (진행중)' : ''}</span></div>`).join('')}</div>
    <div class="ycards">${rows.map(x => `<div class="yc${x.cur ? ' cur' : ''}"><small>${x.y}년 발령 · 사직율</small><b>${x.p}명</b><span>사직율 <em>${pct(x.rate)}</em>${x.cur && prev ? ` · <span class="${x.rate > prev.rate ? 'up' : 'dn'}">${x.rate > prev.rate ? '▲' : '▼'}${Math.abs((x.rate - prev.rate) * 100).toFixed(1)}%p vs ${prev.y}</span>` : ''}</span></div>`).join('')}</div>
  </section>`;
}
function p1(){
  const t = totals(), bc = byCohort(), ds = depts();
  const sel = COH.filter(inC), latest = sel.at(-1) || COH.at(-1);
  const groups = GNAMES.filter(inG).map(g => ({ g, p: ds.filter(d => d.g === g).reduce((s, d) => s + d.p, 0) }));
  // 회차별 발령인원 표
  const bcs = bc.filter(b => inC(b.c));
  const cohTable = `<div class="tw"><table class="gt ct"><thead><tr><th>회차</th><th class="num">발령일</th><th class="num">발령인원</th><th class="num">비중</th><th class="num">재직</th><th class="num">사직</th><th class="num">경과</th></tr></thead><tbody>
    ${bcs.map(b => `<tr><td><b>${cLab(b.c)}</b></td><td class="num">${b.c.replaceAll('-', '.')}</td><td class="num"><b>${b.p}명</b></td><td class="num">${pct(b.p / Math.max(1, t.p))}</td><td class="num">${b.p - b.r}명</td><td class="num">${b.r ? `<span class="rdx">${b.r}명</span>` : '0명'}</td><td class="num zero">D+${days(new Date(b.c + 'T00:00:00'), TODAY)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>합계</td><td class="num">${bcs.length}개 회차</td><td class="num">${t.p}명</td><td class="num">100%</td><td class="num">${t.p - t.r}명</td><td class="num">${t.r}명</td><td></td></tr></tfoot></table></div>`;
  // 회차 × 부서군 배치 표
  const gcols = GNAMES.filter(inG);
  const gp = (c, g) => Object.entries(A.dept).reduce((s, [k, [p]]) => { const [cc, d] = k.split('|'); return cc === c && grpOf(d) === g && inD(d) ? s + p : s; }, 0);
  const gm = bcs.map(b => ({ c: b.c, v: gcols.map(g => gp(b.c, g)) }));
  const gmax = Math.max(1, ...gm.flatMap(r => r.v));
  const gtot = gcols.map((g, i) => gm.reduce((s, r) => s + r.v[i], 0));
  const gcell = (v, rowTot) => v ? `<td class="num heat" style="--p:${Math.round(v / gmax * 26)}%">${v}명<small class="sh">${pct(v / Math.max(1, rowTot), 0)}</small></td>` : `<td class="num zero">0명</td>`;
  const grpTable = `<div class="tw"><table class="gt gtab"><thead><tr><th>회차</th>${gcols.map(g => `<th class="num">${g}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>
    ${gm.map(r => { const rt = r.v.reduce((s, x) => s + x, 0); return `<tr><td><b>${cLab(r.c)}</b> <span class="zero">${cShort(r.c)}</span></td>${r.v.map(v => gcell(v, rt)).join('')}<td class="num"><b>${rt}명</b></td></tr>`; }).join('')}
    </tbody><tfoot><tr><td>합계</td>${gtot.map(v => `<td class="num">${v}명<small class="sh">${pct(v / Math.max(1, t.p), 0)}</small></td>`).join('')}<td class="num">${t.p}명</td></tr></tfoot></table></div>`;
  const tl = bc.map(b => {
    const dd = days(new Date(b.c + 'T00:00:00'), TODAY);
    return `<div class="tli ${inC(b.c) ? '' : 'dim'}" data-tip="${cLab(b.c)} ${b.c}\n발령 ${b.p}명 · 사직 ${b.r}명 · 재직 ${b.p-b.r}명">
      <span class="no">${cLab(b.c)}</span><span class="dt">${b.c.replaceAll('-', '.')}</span>
      <div class="meta"><span>발령 <b class="num">${b.p}</b>명</span><span class="num">D+${dd}</span></div>
      <div class="bar2" aria-hidden="true"><b style="flex:${b.p-b.r}"></b><em style="flex:${b.r}"></em></div>
      <div class="meta"><span>재직 ${b.p-b.r}</span><span>사직 ${b.r}</span></div></div>`;
  }).join('') + `<div class="tli next"><span class="no" style="color:var(--muted)">${COH.length+1}차</span><span class="dt">발령 예정</span><div class="meta"><span>다음 발령일자가 시트에 추가되면 자동으로 표시됩니다</span></div></div>`;

  // dept × cohort table
  // 구분별 그룹 표: 그룹 머리행 → 부서 → 소계, 마지막에 전체 합계
  const placed = (d, c) => A.dept[c + '|' + d]?.[0] || 0;
  const q = S.q.trim().toLowerCase();
  const sumRow = (list, c) => list.reduce((s, d) => s + placed(d, c), 0);
  const all = [];
  let body = '';
  for (const [g, list] of GROUPS){
    if (!inG(g)) continue;
    const rows = list.filter(d => inD(d) && (!q || d.toLowerCase().includes(q) || g.includes(q)));
    if (!rows.length) continue;
    all.push(...rows);
    body += `<tr class="gh"><td colspan="${sel.length + 2}">${g}</td></tr>`;
    if (!S.compact) body += rows.map(d => { const tot = sel.reduce((s, c) => s + placed(d, c), 0);
      return `<tr data-tip="${d} (${g})\n${sel.map(c => `${cLab(c)} ${placed(d, c)}명`).join(' · ')}\n누적 ${tot}명"><td><b>${d}</b></td>${sel.map(c => { const v = placed(d, c); return `<td class="num ${v ? '' : 'zero'}">${v}명</td>`; }).join('')}<td class="num cum">${tot}명</td></tr>`; }).join('');
    body += `<tr class="sub"><td>${g} 소계</td>${sel.map(c => `<td class="num">${sumRow(rows, c)}명</td>`).join('')}<td class="num">${sel.reduce((s, c) => s + sumRow(rows, c), 0)}명</td></tr>`;
  }
  const table = `<div class="tw"><table class="gt"><thead><tr><th>부서</th>
      ${sel.map(c => `<th class="num coh">${cLab(c)} <span class="dfull">(${c})</span><span class="dshort">${cShort(c)}</span></th>`).join('')}<th class="num">누적인원</th></tr></thead>
    <tbody>${body || `<tr><td colspan="${sel.length + 2}" class="zero">'${esc(S.q)}'에 해당하는 부서가 없습니다.</td></tr>`}</tbody>
    ${all.length ? `<tfoot><tr><td>전체 합계 <span style="font-weight:400;color:var(--muted)">${all.length}개 부서</span></td>${sel.map(c => `<td class="num">${sumRow(all, c)}명</td>`).join('')}<td class="num">${sel.reduce((s, c) => s + sumRow(all, c), 0)}명</td></tr></tfoot>` : ''}</table></div>`;

  const tbar = `<div class="tbar"><div class="seg" role="group" aria-label="표 부서 구분">${[['all', '전체'], ...GNAMES.map(g => [g, g])].map(([v, l]) => `<button class="chip" data-fg="${v}" id="tg-${v}" aria-pressed="${S.g === v}">${l}</button>`).join('')}</div>
    <button class="chip ghost" data-compact="1" id="t-compact" aria-pressed="${!!S.compact}">${S.compact ? '부서별 펼치기' : '소계만 보기'}</button></div>`;
  return `<div style="display:grid;gap:20px">
  <div class="kpis">
    ${kpi(SB.y !== 'all' ? Y0 + '년 발령인원' : (YEARS.length > 1 ? '총 발령인원 (전체 연도)' : '총 발령인원 (누적)'), t.p, '명', cmp([[Y1 + '년', (pa(Y1).placed ?? '–') + '명'], [Y2 + '년', (pa(Y2).placed ?? '–') + '명']]))}
    ${kpi('발령 회차', sel.length, '회', `최근 ${latest.replaceAll('-', '.')} (${cLab(latest)})`)}
    ${kpi('현재 재직인원', t.p - t.r, '명', `사직 ${t.r}명 제외`)}
    ${kpi('사직율', pct(t.r / t.p), '', cmp([[Y1 + '년', pct(pa(Y1).rate)], [Y2 + '년', pct(pa(Y2).rate)]]))}
  </div>
  ${yoy()}
  <div class="grid">
    <section class="panel w12"><div class="ph"><div><h2>발령 회차 정보</h2><p>막대: 재직(파랑) · 사직(빨강) 비율, D+는 기준일까지 경과일</p></div></div><div class="tl">${tl}</div></section>
    <section class="panel w7"><div class="ph"><div><h2>발령일자별 총 발령인원</h2><p>단위: 명</p></div></div>
      ${vbars(bc.filter(b => inC(b.c)).map(b => ({ label: cLab(b.c), sub: b.c.replaceAll('-', '.'), v: b.p, tip: `${cLab(b.c)} ${b.c}\n발령 ${b.p}명` })), { h: 170 })}
      ${cohTable}</section>
    <section class="panel w5"><div class="ph"><div><h2>부서군별 배치</h2><p>선택한 회차 기준 발령인원</p></div></div>
      ${hbars(groups.map(x => ({ label: x.g, v: x.p, vl: x.p + '명', tip: `${x.g} 발령 ${x.p}명 (${pct(x.p / t.p)})` })))}
      <div class="note">${GROUPS.map(([g, l]) => `${g} ${l.length}`).join(' · ')}개 부서로 구분합니다.</div></section>

const PERIODS = ['1개월 이내','2개월 이내','3개월 이내','6개월 이내','12개월 이내','12개월 이상'];

const RANK_ORDER = ['0–10%','10–20%','20–30%','30–50%','50% 이상','미기재'];

/* ---------- 기간별 조회 (사직분석) ---------- */
const MODES = [['now','현재'],['year','연도'],['half','반기'],['quarter','분기'],['month','월']];
const PS = { mode:'now', keys:[] };
const keysOf = pr => pr.key.split(',');
function periodList(mode){
  if (mode === 'now') return [{ key:'now', label:'현재 (누적)', short:'누적', s:new Date(0), e:TODAY, ivs:[{ s:new Date(0), e:TODAY }] }];
  const out = [], y0 = DAY0.getFullYear(), y1 = TODAY.getFullYear();
  const first = new Date(y0, DAY0.getMonth(), 1);
  for (let y = y0; y <= y1; y++){
    const parts = mode === 'year' ? [[0, 12, `${y}년`, `${y}년`]]
      : mode === 'half' ? [[0, 6, `${y} 상반기`, '상반기'], [6, 6, `${y} 하반기`, '하반기']]
      : mode === 'quarter' ? [0, 1, 2, 3].map(q => [q * 3, 3, `${y} ${q + 1}분기`, `${q + 1}분기`])
      : Array.from({ length: 12 }, (_, m) => [m, 1, `${y}년 ${m + 1}월`, `${m + 1}월`]);
    for (const [m0, len, label, short] of parts){
      const s = new Date(y, m0, 1), e = new Date(y, m0 + len, 0);
      if (s > TODAY || e < first) continue;
      out.push({ key:`${mode}-${y}-${m0}`, label, short: y0 === y1 || mode === 'year' ? short : `${String(y).slice(2)}.${short}`, s, e: e > TODAY ? TODAY : e, open: e > TODAY, ivs:[{ s, e: e > TODAY ? TODAY : e }] });
    }
  }
  return out;
}
// 기본 선택: 시작한 지 2주가 안 된 기간은 건너뛰고 그 직전 기간
function defPeriod(L){ const cut = addDays(fmtD(TODAY).replaceAll('.', '-'), -14); return [...L].reverse().find(p => p.s <= cut) || L.at(-1); }
function curSel(){ const L = periodList(PS.mode), s = L.filter(p => PS.keys.includes(p.key)); return s.length ? s : [defPeriod(L)]; }
function curPeriod(){
  const s = curSel(); if (s.length === 1) return s[0];
  return { key: s.map(x => x.key).join(','), multi: true, label: s.map(x => x.short).join(' + '), short: `${s.length}개 구간`, s: s[0].s, e: s.at(-1).e, open: s.some(x => x.open), ivs: s.flatMap(x => x.ivs) };
}
const inPer = (d, pr) => pr.ivs.some(iv => d >= iv.s && d <= iv.e);
// 회차×부서군 단위로 발령인원과 사직일 목록
function units(){
  const u = {};
  for (const [k, [p]] of Object.entries(A.dept)){
    const [c, d] = k.split('|'), g = grpOf(d);
    if (!inC(c) || !inG(g)) continue;
    (u[c + '|' + g] ??= { c, g, p:0, rd:[] }).p += p;
  }
  for (const r of A.res){
    const x = u[r[0] + '|' + r[1]]; if (!x) continue;
    for (let i = 0; i < r[6]; i++) x.rd.push(addDays(r[0], r[5]));
  }
  return Object.values(u);
}
// [기간 중 재직 인원, 기간 중 사직 인원]
function base(c, p, rd, pr){
  const cd = new Date(c + 'T00:00:00');
  if (cd > pr.e) return [0, 0];
  // 미사직자는 발령일이 마지막 구간 종료 전이면 포함, 사직자는 어느 한 구간이라도 재직 기간이 겹치면 포함
  return [(p - rd.length) + rd.filter(d => pr.ivs.some(iv => cd <= iv.e && d >= iv.s)).length, rd.filter(d => inPer(d, pr)).length];
}
function perTotals(pr, list = units()){
  let n = 0, r = 0; for (const x of list){ const [a, b] = base(x.c, x.p, x.rd, pr); n += a; r += b; } return { n, r };
}
function perCohort(pr){
  const U = units();
  return COH.filter(inC).map(c => ({ c, ...perTotals(pr, U.filter(x => x.c === c)) })).filter(x => x.n);
}
function facetP(obj, pr){
  const m = {};
  for (const [k, [p, ds]] of Object.entries(obj)){
    const [c, g, key] = k.split('|');
    if (!inC(c) || !inG(g)) continue;
    const [a, b] = base(c, p, ds.map(d => addDays(c, d)), pr);
    if (!a) continue;
    m[key] ??= [0, 0]; m[key][0] += a; m[key][1] += b;
  }
  return m;
}
const resP = pr => resF().filter(r => inPer(addDays(r[0], r[5]), pr));

}

function survAt(c, m){

      ${vbars(gs.map(x => ({ label: x.g, sub: `${x.r} / ${x.p}명`, v: x.p ? x.r / x.p : 0, vl: pct(x.r / x.p, 0), c: 'var(--s1)', tip: `${x.g}: 사직 ${x.r} / 발령 ${x.p}명 = ${pct(x.r / x.p)}` })), { max: Math.max(.45, ...gs.map(x => x.p ? x.r / x.p : 0)) * 1.15, h: 180, refs: [{ v: TARGET, label: '목표 20%' }, { v: avg, label: '평균', cls: 'avg' }] })}
      ${gsort.length > 1 ? `<div class="note"><b>${gsort[0].g}</b>(${pct(gsort[0].r / gsort[0].p)})가 가장 낮고 <b>${gsort.at(-1).g}</b>(${pct(gsort.at(-1).r / gsort.at(-1).p)})가 가장 높습니다.</div>` : ''}

const svLab = (c, short) => short ? `${+c.date.slice(5, 7)}월 발령` : `${c.date.slice(0, 4)}년 ${+c.date.slice(5, 7)}월 발령`;
const sc2 = v => v == null ? '–' : v.toFixed(2);

function areaMean(c, a){ const ix = SQ.map((q, i) => i).filter(i => SQ[i][0] === a && i !== 2); const v = ix.map(i => c.q[i]).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }
function sbar(v, lo, hi, col){ const w = v == null ? 0 : Math.max(2, Math.min(100, (v - lo) / (hi - lo) * 100)); return `<span class="sbar"><i style="width:${w}%;background:${col}"></i></span>`; }

// 여러 회차를 응답 인원 가중으로 합친 '전체' 회차
function svTotal(cs){
  const N = cs.reduce((s, c) => s + c.n, 0);
  const wm = f => { let s = 0, n = 0; for (const c of cs){ const v = f(c); if (v != null){ s += v * c.n; n += c.n; } } return n ? s / n : null; };
  const sum = f => cs.reduce((s, c) => s + (f(c) || 0), 0);
  const addMap = k => { const o = {}; cs.forEach(c => Object.entries(c[k] || {}).forEach(([t, v]) => { o[t] = (o[t] || 0) + v; })); return o; };
  const dept = {};
  cs.forEach(c => Object.entries(c.dept || {}).forEach(([k, [n, m, p]]) => {
    const d = dept[k] || (dept[k] = { n: 0, ms: 0, mn: 0, ps: 0, pn: 0 });
    d.n += n; if (m != null){ d.ms += m * n; d.mn += n; } if (p != null){ d.ps += p * n; d.pn += n; }
  }));
  Object.keys(dept).forEach(k => { const d = dept[k]; dept[k] = [d.n, d.mn ? d.ms / d.mn : null, d.pn ? d.ps / d.pn : null]; });
  return { all: true, k: cs.length, date: 'all', n: N,
    q: Array.from({ length: 25 }, (_, i) => wm(c => c.q[i])), top: Array.from({ length: 24 }, (_, i) => wm(c => c.top && c.top[i])),
    overall: wm(c => c.overall), dept, help: addMap('help'), opin: addMap('opin'), opinBlank: sum(c => c.opinBlank),
    placed: sum(c => c.placed), target: sum(c => c.target), period: '',
    notes: cs.flatMap(c => (c.notes || []).map(t => `[${svLab(c)}]\n${t}`)) };
}

  if (!cs.length) cs = SV.cohorts;
  const multiYear = new Set(cs.map(c => c.date.slice(0, 4))).size > 1;

  const on = c => !isAll && c === cur, cc = c => on(c) ? ' cur' : '';
  const N = cs.reduce((s, c) => s + c.n, 0), wavg = f => { let s = 0, n = 0; for (const c of cs){ const v = f(c); if (v != null){ s += v * c.n; n += c.n; } } return n ? s / n : null; };

  // 문항별 순위 (선택 회차)
  const ranked = SQ.map((q, i) => ({ i, v: cur.q[i] })).filter(x => x.i !== 2 && x.v != null).sort((a, b) => a.v - b.v);
  const kpis = `<div class="kpis">

    ${kpi('설문 응답', cur.n, '명', isAll ? `${cs.length}개 회차 합계 · 발령 ${cur.placed || '–'}명` : `응답률 ${cur.target ? pct(cur.n / cur.target, 0) : '–'} · 발령 ${cur.placed ?? '–'}명 · 누적 응답 ${N}명`)}
    ${kpi('사전학습률', cur.q[2] == null ? '–' : cur.q[2].toFixed(1), '%', `가장 낮은 문항: ${SQ[ranked[0].i][1]} ${sc2(ranked[0].v)}`)}
  </div>`;
  // 회차별 추이

    <div class="svtrend">${cs.map(c => `<div class="svtr${on(c) ? ' on' : ''}" data-tip="${L(c)} · 응답 ${c.n}명\n만족도 ${sc2(c.overall)} / 5\n수행도 ${c.q[24] == null ? '–' : c.q[24].toFixed(1)} / 100\n설문시기 ${esc(c.period || '–')}">
      <b>${L(c)}</b><span class="svl">만족도</span>${sbar(c.overall, 4, 5, 'var(--s1)')}<span class="num">${sc2(c.overall)}</span>
      <span class="svl">수행도</span>${sbar(c.q[24], 0, 100, 'var(--s2)')}<span class="num">${c.q[24] == null ? '–' : c.q[24].toFixed(1)}</span></div>`).join('')}</div>
    <div class="note">만족도 막대는 4.0~5.0점 구간을 확대해 표시합니다. 만족도에 비해 수행도가 낮게 나타나 독립 전후 현장 밀착 지원이 필요한지 함께 봅니다.</div></section>`;

    <div class="tw"><table class="mt svt"><thead><tr><th>영역</th>${cs.map(c => `<th class="num${cc(c)}">${L(c)}</th>`).join('')}</tr></thead><tbody>
    ${SAREAS.map(a => `<tr><td><b>${a}</b></td>${cs.map(c => { const v = areaMean(c, a); return `<td class="num heat${cc(c)}" ${heat(v)}>${sc2(v)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></section>`;
  // 문항별
  const items = `<section class="panel w12"><div class="ph"><div><h2>문항별 만족도</h2><p><span class="lowkey">빨간 칸</span> = 만족도 ${SVLOW}점 미만 · 5점 비율 = ${L(cur)} '매우 그렇다' 응답 비율</p></div></div>
    <div class="tw"><table class="mt svt svq"><thead><tr><th>No</th><th class="l">영역</th><th class="l">문항</th>${cs.map(c => `<th class="num${cc(c)}">${L(c)}</th>`).join('')}<th class="num">${isAll ? '전체' : L(cur)}<br>5점 비율</th></tr></thead><tbody>
    ${SQ.map(([a, s, full], i) => `<tr data-tip="${i + 1}. ${esc(full)}"><td class="num">${i + 1}</td><td class="l">${a}</td><td class="l">${s}</td>
      ${cs.map(c => i === 2 ? `<td class="num${cc(c)}">${c.q[2] == null ? '–' : c.q[2].toFixed(1) + '%'}</td>` : `<td class="num heat${cc(c)}" ${heat(c.q[i])}>${sc2(c.q[i])}</td>`).join('')}
      <td class="num">${i === 2 || cur.top[i] == null ? '–' : pct(cur.top[i], 0)}</td></tr>`).join('')}
    <tr class="qsum"><td></td><td colspan="2" class="l"><b>객관문항 평균</b></td>${cs.map(c => `<td class="num${cc(c)}" ${heat(c.overall)}><b>${sc2(c.overall)}</b></td>`).join('')}<td></td></tr>
    <tr class="qsum"><td class="num">25</td><td colspan="2" class="l"><b>임상간호업무 수행도 (100점)</b></td>${cs.map(c => `<td class="num${cc(c)}"><b>${c.q[24] == null ? '–' : c.q[24].toFixed(1)}</b></td>`).join('')}<td></td></tr>
    </tbody></table></div></section>`;
  // 근무부서별 (인원 제한 없이 표시)
  const dkeys = Object.keys(SV.depts);
  const dept = `<section class="panel w5"><div class="ph"><div><h2>근무부서별 만족도</h2><p>${L(cur)} · 28번 문항(현재 근무부서) 응답 기준</p></div></div>
    <div class="tw"><table class="mt svt"><thead><tr><th>근무부서</th><th class="num">응답</th><th class="num">만족도</th><th class="num">수행도</th></tr></thead><tbody>
    ${dkeys.filter(k => cur.dept[k] && cur.dept[k][0] > 0).map(k => { const [n, m, p] = cur.dept[k]; return `<tr><td><b>${SV.depts[k]}</b></td><td class="num">${n}명</td><td class="num heat" ${heat(m)}>${sc2(m)}</td><td class="num">${p == null ? '–' : p.toFixed(1)}</td></tr>`; }).join('')}
    </tbody></table></div></section>`;
  // 주관식: 주제별 건수
  const theme = (title, sub, key, extra, w) => {
    const ks = Object.keys(cur[key]).sort((a, b) => cur[key][b] - cur[key][a]);
    const max = Math.max(1, ...ks.map(k => cur[key][k]));
    return `<section class="panel ${w || 'w4'}"><div class="ph"><div><h2>${title}</h2><p>${sub}</p></div></div>
      ${hbars(ks.map(k => ({ label: k, v: cur[key][k], vl: `${cur[key][k]}건`, n: undefined, tip: `${k}\n${cs.map(c => `${L(c)} ${c[key][k] ?? 0}건 (응답 ${c.n}명 중 ${pct((c[key][k] ?? 0) / c.n, 0)})`).join('\n')}` })), { max })}
      ${extra || ''}</section>`;
  };
  const help = theme('업무 적응에 도움이 된 교육', `26번 주관식 · ${L(cur)} 응답 ${cur.n}명 · 한 응답에 여러 주제가 있으면 각각 1건 · 원문은 공개하지 않음`, 'help', '', 'w6');
  const opin = theme('교육과정 전반 의견 주제', `27번 주관식 · ${L(cur)} · 막대에 마우스를 올리면 회차별 건수`, 'opin', `<div class="note">의견 없음·마침표만 입력한 응답 ${cur.opinBlank}건 제외</div>`, 'w6');
  // 총평
  const notes = `<section class="panel w7"><div class="ph"><div><h2>간호교육팀 총평 및 개선</h2><p>${L(cur)}${isAll ? '' : ` · 설문시기 ${esc(cur.period || '–')}`} · 설문 결과 파일의 '총평 및 개선안' 내용</p></div></div>
    ${(cur.notes || []).length ? `<div class="svnotes">${cur.notes.map(t => `<div class="svnote">${esc(t)}</div>`).join('')}</div>` : '<p class="zero">총평이 없습니다.</p>'}</section>`;
  return `<div style="display:grid;gap:20px">
    ${head(`신규간호사 교육과정 설문(간호관리실 양식) · 등록 ${SV.cohorts.length}개 회차 · 누적 응답 ${N}명`)}
    ${yearNote}${chips}${kpis}
    <div class="grid">${trend}${areas}${items}${help}${opin}${dept}${notes}</div>
  </div>`;
}

function showMsg(title, body){
  document.getElementById('view').innerHTML = `<section class="panel w12 msg"><h2>${title}</h2><p>${body}</p></section>`;
}
function stamp(){
  document.getElementById('today').textContent = fmtD(TODAY);

  document.getElementById('upd').textContent = u ? u.slice(5).replace('-', '.') : '–';

function liveState(kind, note){
  const d = document.getElementById('live-dot');
  d.dataset.state = kind;

async function boot(){
  navSync();
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
  if (cached?.data){ setData(cached.data); render(); liveState('stale', '저장된 데이터를 먼저 표시하고 최신 데이터를 불러오는 중입니다'); }
  else showMsg('데이터를 불러오는 중입니다', '구글 시트에서 최신 집계를 가져오고 있습니다. 처음 접속할 때는 몇 초 걸릴 수 있습니다.');
  if (!CFG.API_URL){
    if (!cached) showMsg('연결 설정이 필요합니다', 'config.js 파일의 API_URL에 Apps Script 웹앱 주소를 입력해 주세요. 자세한 방법은 README.md의 설치 안내를 참고하세요.');
    liveState('error', 'API_URL 미설정');
    return;
  }
  try {
    const res = await fetch(CFG.API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    setData(data); render(); liveState('live', '최신 데이터');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  } catch (err) {
    if (cached?.data){ liveState('error', '최신 데이터를 불러오지 못해 저장본을 표시 중입니다: ' + err.message); }
    else { showMsg('데이터를 불러오지 못했습니다', `잠시 후 새로고침해 주세요. 계속 안 되면 Apps Script 배포 상태와 config.js의 주소를 확인하세요. (${esc(err.message)})`); liveState('error', err.message); }
  }
}

function syncPS(){
  const Y = SB.y === 'all' ? TODAY.getFullYear() : SB.y;
  if (SB.m.length){ PS.mode = 'month'; PS.keys = SB.m.map(m => `month-${Y}-${m}`); }
  else if (SB.q.length){ PS.mode = 'quarter'; PS.keys = SB.q.map(q => `quarter-${Y}-${q * 3}`); }
  else if (SB.y !== 'all'){ PS.mode = 'year'; PS.keys = [`year-${SB.y}-0`]; }
  else { PS.mode = 'now'; PS.keys = []; }
}

    <div class="fs"><span class="fl">분기</span><div class="cg">${chip('data-sq', 'all', '전체', !SB.q.length)}${[0, 1, 2, 3].map(q => chip('data-sq', q, `${q + 1}분기`, SB.q.includes(q), !okQ.has(`quarter-${Y}-${q * 3}`))).join('')}</div></div>
    <div class="fs"><span class="fl">월</span><div class="cg mg">${Array.from({ length: 12 }, (_, m) => chip('data-sm', m, `${m + 1}월`, SB.m.includes(m), !okM.has(`month-${Y}-${m}`))).join('')}</div></div>
    <div class="fs"><label class="fl" for="sel-g">부서</label><select id="sel-g"><option value="all">전체 부서</option>${GNAMES.map(g => `<option value="${g}" ${S.g === g ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    <div class="fs"><label class="fl" for="sel-d">세부부서</label><select id="sel-d" ${S.g === 'all' ? 'disabled' : ''}>${S.g === 'all' ? '<option value="all">부서를 먼저 선택</option>' : `<option value="all">전체 (${S.g})</option>${deps.map(d => `<option value="${d}" ${S.d === d ? 'selected' : ''}>${d}</option>`).join('')}`}</select></div>
    <p class="fhint">${S.page === 'p2' ? '기간은 <b>사직일</b> 기준입니다.' : '기간은 <b>발령일</b> 기준입니다.'}${(SB.q.length || SB.m.length) && SB.y === 'all' ? ` 분기·월은 ${Y}년 기준입니다.` : ''}</p>
    <button class="freset" data-freset="1">조건 초기화</button>`;
  const pr = curPeriod();

function calc(){
  const n = document.getElementById('c-need'); if (!n) return;
  const need = +n.value || 0, r = Math.min(.9, (+document.getElementById('c-rate').value || 0) / 100);
  const hire = Math.ceil(need / (1 - r));
  document.getElementById('c-out').textContent = hire + '명';
  document.getElementById('c-sub').textContent = `${need}명 ÷ (1 − ${(r * 100).toFixed(1)}%) · 3개월 후 약 ${Math.round(hire * (1 - r))}명 유지`;
}
function render(){
  navSync();
  if (!A) return;
  setYear();
  stamp();
  filters();
  const v = document.getElementById('view');
  if (S.page === 'p2' && S.d !== 'all'){
    // 사직 시점·사유는 개인 식별을 막기 위해 부서군 단위로만 제공되므로, 세부부서 선택 시 소속 부서군 기준으로 보여준다
    const keep = S.d; let p = 0, r = 0;
    for (const [k, [pp, rr]] of Object.entries(A.dept)){ const [c, d] = k.split('|'); if (d === keep){ p += pp; r += rr; } }
    S.d = 'all';
    v.innerHTML = `<div class="note dnote"><b>${keep}</b> 자체 누적: 발령 ${p}명 · 사직 ${r}명 · 사직율 ${pct(p ? r / p : NaN)}<br>사직 시점·사유 분석은 개인이 드러나지 않도록 소속 부서군(<b>${S.g}</b>) 기준으로 표시합니다.</div>` + p2();
    S.d = keep;
  } else v.innerHTML = ({ p1, p2, p3, p4 })[S.page]();
  const sv = document.getElementById('surv'); if (sv) survival(sv);
  calc();
}

  else if (b.dataset.fc){ S.c = b.dataset.fc; render(); }
  else if (b.dataset.fg){ S.g = b.dataset.fg; S.d = 'all'; S.need = S.erate = undefined; render(); }
  else if (b.dataset.sy){ SB.y = b.dataset.sy === 'all' ? 'all' : +b.dataset.sy; syncPS(); render(); }
  else if (b.dataset.sq){ const q = b.dataset.sq; SB.m = []; SB.q = q === 'all' ? [] : (SB.q.includes(+q) ? SB.q.filter(x => x !== +q) : [...SB.q, +q].sort()); syncPS(); render(); }
  else if (b.dataset.sm){ const m = +b.dataset.sm; SB.q = []; SB.m = SB.m.includes(m) ? SB.m.filter(x => x !== m) : [...SB.m, m].sort((x, y) => x - y); syncPS(); render(); }
  else if (b.dataset.freset){ SB.y = 'all'; SB.q = []; SB.m = []; S.g = 'all'; S.d = 'all'; syncPS(); render(); }
  else if (b.dataset.print){
    S.printing = true; render();
    document.body.classList.add('printing');
    const prevTitle = document.title;
    document.title = '신규간호사_부서별_사직현황_' + fmtD(new Date()).replaceAll('.', '');
    setTimeout(() => { window.print(); document.title = prevTitle; }, 50);
  }
  else if (b.dataset.refresh){ if (typeof boot === 'function') boot(); else render(); }
  else if (b.dataset.pm){ PS.mode = b.dataset.pm; PS.keys = []; render(); }
  else if (b.dataset.pk){
    const [m, y, n] = b.dataset.pk.split('-');
    if (m === 'month'){ SB.y = +y; SB.q = []; SB.m = SB.m.includes(+n) && PS.mode === 'month' ? SB.m.filter(x => x !== +n) : [...new Set([...(PS.mode === 'month' ? SB.m : []), +n])].sort((a, c) => a - c); }
    else if (m === 'quarter'){ SB.y = +y; SB.m = []; const q = +n / 3; SB.q = SB.q.includes(q) ? SB.q.filter(x => x !== q) : [...SB.q, q].sort(); }
    else if (m === 'year'){ SB.y = +y; SB.q = []; SB.m = []; }
    syncPS(); render();
  }
  else if (b.dataset.pall){ PS.keys = periodList(PS.mode).map(x => x.key); render(); }
  else if (b.dataset.preset){ PS.keys = []; render(); }
  else if (b.dataset.pstep){
    const L = periodList(PS.mode), s = curSel(), st = +b.dataset.pstep;
    const i = st > 0 ? L.findIndex(x => x.key === s.at(-1).key) + 1 : L.findIndex(x => x.key === s[0].key) - 1;
    if (L[i]){ PS.keys = [L[i].key]; render(); }
  }
  else if (b.dataset.compact){ S.compact = !S.compact; render(); }
  else if (b.dataset.tab){ S.tab = b.dataset.tab; render(); }
  else if (b.dataset.sort){ const k = b.dataset.sort; S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : (k === 'd' ? 1 : -1) }; render(); }
});
addEventListener('afterprint', () => { document.body.classList.remove('printing', 'svprint'); if (S.printing){ S.printing = false; render(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'sel-g'){ S.g = e.target.value; S.d = 'all'; render(); }
  if (e.target.id === 'sel-d'){ S.d = e.target.value; render(); }
});
if (typeof matchMedia === 'function' && matchMedia('(max-width: 820px)').matches){ const fc = document.getElementById('fcard'); if (fc) fc.open = false; }
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'c-need'){ S.need = e.target.value; calc(); }
  if (e.target.id === 'c-rate'){ S.erate = e.target.value; calc(); }
});
const setTbh = () => { const tb = document.querySelector('.topbar'); if (tb) document.documentElement.style.setProperty('--tbh', tb.offsetHeight + 'px'); };
setTbh(); addEventListener('resize', setTbh);
const tip = document.getElementById('tip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]');
  if (!t || !t.dataset.tip){ tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z')) || 1; // 화면 확대 보정
  tip.style.left = x / z + 'px'; tip.style.top = y / z + 'px';
});
document.addEventListener('pointerleave', () => tip.hidden = true);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const sv = document.getElementById('surv'); if (sv) survival(sv); }, 120); });
const h = location.hash.slice(1); if (PAGES[h]) S.page = h;
navSync();
addEventListener('hashchange', () => { const k = location.hash.slice(1); if (PAGES[k] && k !== S.page){ S.page = k; render(); } });
boot();
</script>
</body>
